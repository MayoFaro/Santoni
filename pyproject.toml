[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santoni"
version = "0.1.0"
description = "Entraînement natif à Santorini"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "torch>=2.2"]

[project.scripts]
santoni = "santorini.ui:main"

[tool.setuptools]
packages = ["santorini", "santoni_az"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
