[package]
name = "santoni-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "selfplay_worker"
path = "src/bin/selfplay_worker.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
# Zero-cost by default. Enables timers around the remaining per-node PV
# clone in Search::minimax, read with `cargo test --features profile --
# --nocapture --test-threads 1`. Never built into the shipped library.
profile = []
